#强制激活 MyBatis-Plus 自动配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartresume.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  # 安全配置
  security:
    user:
      name: admin
      password: admin

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/smart_resume_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 2

jwt:
  secret: mySuperSecretKeyThatIsAtLeast64CharactersLongForHS512AlgorithmSecurityPurposes2024
  expiration: 86400

# DashScope Qwen API 配置
dashscope:
  api:
    key: sk-e4b205a785134bd3a7c8c4f3d18b9616
    url: https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation

qwen:
  api:
    key: sk-e4b205a785134bd3a7c8c4f3d18b9616

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always